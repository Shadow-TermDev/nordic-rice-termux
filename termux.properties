# Nordic RICE — Termux properties (minimal)
# Full docs: https://wiki.termux.com/wiki/Terminal_Settings

# Cursor
terminal-cursor-blink-rate = 400
terminal-cursor-style = bar

# Scrollback
terminal-transcript-rows = 5000

# Extra keys — 2 compact rows (Nordic: CLEAR + SHIFT)
extra-keys = [ \
  [ESC, '/', '-', HOME, SHIFT, UP, END, PGUP], \
  [TAB, CTRL, ALT, {macro: "CTRL l", display: "CLEAR"}, LEFT, DOWN, RIGHT, PGDN] \
]

# Bell
bell-character = ignore
