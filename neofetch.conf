# Nordic neofetch config — clean, minimal, Nord palette

print_info() {
    title

    divider() {
        printf '%s\n' "───────────────────────────────"
    }

    divider

    # User@host — fallback-safe
    printf '  󰇽 %s@%s\n' "${USER:-$(whoami)}" "${HOSTNAME:-$(hostname 2>/dev/null || uname -n)}"
    printf '\n'
    info "  󰌽 OS" distro
    info "  󰏗 Host" model
    info "  󰔚 Uptime" uptime
    info "  󰏒 Packages" packages
    info "  󰞷 Shell" shell
    info "  󰈙 CPU" cpu
    info "  󰍛 Memory" memory
    info "  󰋊 Disk" disk

    printf '\n'
    colors
}

# ── Display ──────────────────────────────────────────────────
title_shorthand="tiny"
kernel_shorthand="on"
distro_shorthand="on"
os_arch=true
uptime_shorthand="tiny"
memory_percent="off"
memory_unit="mib"
package_managers="apt,pkg,pip"
shell_version="off"
speed_type="bios_limit"
speed_shorthand="off"
cpu_display="on"
cpu_cores="logical"
bold="on"
color_blocks="on"
block_range=(0 15)
block_width=3
block_height=1
gap=3
yoffset=0
xoffset=0
stdout="off"
vertical_separator="no"

# ── Image / ASCII ────────────────────────────────────────────
image_backend="ascii"
image_source="auto"
ascii_colors=(distro)
ascii_distro="Android"
ascii_bold="on"
