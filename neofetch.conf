# Nordic neofetch config — clean, minimal

print_info() {
    title

    divider() {
        printf "%s\n" "───────────────────────────────"
    }

    divider

    printf "  󰇽 %s@%s\n" "${USER:-$(whoami)}" "${HOSTNAME:-$(hostname)}"
    printf "\n"
    info "  󰌽 OS" distro
    info "  󰏗 Host" model
    info "  󰔚 Uptime" uptime
    info "  󰏒 Packages" packages
    info "  󰞷 Shell" shell
    info "  󰈙 CPU" cpu
    info "  󰍛 Memory" memory

    printf "\n"
    colors
}

title_shorthand="tiny"
kernel_shorthand="on"
distro_shorthand="os"
os_arch=true
uptime_shorthand="tiny"
memory_percent="off"
memory_unit="gib"
package_managers="apt,pip"
shell_version="off"
speed_type="raw"
speed_shorthand="off"
bold_enabled="on"
color_blocks="on"
block_range=(0 15)
block_width=3
block_color_maps="distro"
gap=3
vertical_separator="no"
image_backend=""
image_source=""
ascii_colors=(distro)
ascii_distro="Android"
