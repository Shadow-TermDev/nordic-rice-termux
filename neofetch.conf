# Nordic neofetch config — minimal with Nerd Font icons

print_info() {
    local NordBlue="%F{#88c0d0}"
    local NordGreen="%F{#a3be8c}"
    local NordYellow="%F{#ebcb8b}"
    local NordMagenta="%F{#b48ead}"
    local NordRed="%F{#bf616a}"
    local NordCyan="%F{#8fbcbb}"
    local NordFrost="%F{#81a1c1}"
    local Reset="%f"

    title

    divider() {
        printf "%F{#4c566a}───────────────────────────────%f\n"
    }

    divider

    printf "  $NordMagenta󰇽 $USER%f@$NordBlue$HOSTNAME%f\n"
    printf "\n"

    printf "  $NordGreen󰌽 OS$f        %s\n"      "$(distro) $(uname -m)"
    printf "  $NordYellow󰏗 Host$f      %s\n"     "$(model)"
    printf "  $NordCyan󰅐 Kernel$f    %s\n"       "$(kernel)"
    printf "  $NordFrost󰔚 Uptime$f    %s\n"      "$(uptime)"
    printf "  $NordRed󰏒 Packages$f  %s\n"        "$(packages)"
    printf "  $NordMagenta󰞷 Shell$f    %s\n"      "$SHELL"
    printf "  $NordGreen󰍛 Terminal$f %s\n"        "$TERMUX_VERSION"
    printf "  $NordYellow󰈙 CPU$f      %s\n"       "$(cpu)"
    printf "  $NordCyan󰍛 Memory$f    %s\n"        "$(memory)"

    printf "\n"
    colors
}

title_shorthand="tiny"
kernel_shorthand="on"
distro_shorthand="os"
os_arch=true
uptime_shorthand="tiny"
memory_percent="off"
memory_unit="gib"
package_managers="apt,pip"
shell_version="off"
speed_type="raw"
speed_shorthand="off"
bold_enabled="on"
color_blocks="on"
block_range=(0 15)
block_width=3
block_color_maps="distro"
gap=3
vertical_separator="no"
image_backend=""
image_source=""
ascii_colors=(distro)
ascii_distro="auto"
