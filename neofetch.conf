# ── Image / ASCII ────────────────────────────────────────────
image_backend="ascii"
image_source="auto"
ascii_colors=(distro)
ascii_distro="Android"
ascii_bold="on"

# Nordic Neofetch Config - Nord Palette
# Nord Colors: 
# 33 = Frost Blue (#88C0D0), 36 = Cyan (#81A1C1), 34 = Blue (#5E81AC)

print_info() {
    title
    info line_break
    
    # User / Host
    info "  󰇽 User" users
    info line_break
    
    # Specs con iconos Nerd Font
    info "  󰌽 OS" distro
    info "  󰏗 Host" model
    info "  󰔚 Uptime" uptime
    info "  󰏒 Packages" packages
    info "  󰞷 Shell" shell
    info "  󰈙 CPU" cpu
    info "  󰍛 Memory" memory
    info "  󰋊 Disk" disk

    info line_break
    info cols
}

# ── Formatting & Colors ──────────────────────────────────────
# Aplica azul/cyan Nord a las etiquetas y valores
colors=(6 6 7 8 6 7)
bold="on"
underline_enabled="on"
underline_char="─"
separator="  "

# ── Display Settings ─────────────────────────────────────────
title_shorthand="tiny"
kernel_shorthand="on"
distro_shorthand="on"
os_arch="true"
uptime_shorthand="tiny"
memory_percent="off"
memory_unit="mib"
package_managers="apt,pkg,pip"
shell_version="off"
speed_type="bios_limit"
speed_shorthand="off"
cpu_display="on"
cpu_cores="logical"

# ── Color Blocks (Palette preview) ───────────────────────────
color_blocks="on"
block_range=(0 15)
block_width=3
block_height=1
gap=2
yoffset=0
xoffset=0

# ── Image / ASCII Settings ───────────────────────────────────
image_backend="ascii"
image_source="auto"
ascii_distro="Android"
ascii_colors=(6 4)  # Colores Nord para el logo ASCII de Android
ascii_bold="on"
